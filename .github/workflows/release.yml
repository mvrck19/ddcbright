name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: sh packaging/build-deb.sh

      - name: Cache flatpak runtime/SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-23.08

      - name: Cache flatpak-builder sources/build cache
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/**') }}

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Build flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir \
            packaging/flatpak/io.github.mvrck19.ddcbright.yml
          flatpak build-bundle repo ddcbright.flatpak io.github.mvrck19.ddcbright \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            ddcbright.deb
            ddcbright.flatpak

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name ddcbright --add-data "ddcbright/sun.png;ddcbright" run.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/ddcbright.exe

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" ddcbright.deb ddcbright.flatpak ddcbright.exe \
            --title "${{ github.ref_name }}" --generate-notes \
            --repo ${{ github.repository }}
