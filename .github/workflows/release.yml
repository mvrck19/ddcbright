name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.3) -- only used for manual runs, ignored on a tag push'
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}" -replace '^v', ''
          dotnet publish windows/DdcBright/DdcBright.csproj -c Release -r win-x64 -o publish-out -p:Version=$version

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DSourceExe="$pwd\publish-out\ddcbright.exe" /DMyAppVersion="$version" packaging\windows\ddcbright.iss

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}" -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Copy-Item publish-out\ddcbright.exe "dist-windows\ddcbright-$version-portable.exe"
          Copy-Item packaging\windows\ddcbright-setup.exe "dist-windows\ddcbright-setup-$version.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-windows/*

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "${{ env.RELEASE_TAG }}" "ddcbright-$version-portable.exe" "ddcbright-setup-$version.exe" \
            --title "${{ env.RELEASE_TAG }}" --generate-notes \
            --repo ${{ github.repository }}
