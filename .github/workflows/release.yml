name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true # best-effort only -- must never block the Windows release
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: sh packaging/build-deb.sh

      - name: Cache flatpak runtime/SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-23.08

      - name: Cache flatpak-builder sources/build cache
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/**') }}

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Build flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir \
            packaging/flatpak/io.github.mvrck19.ddcbright.yml
          flatpak build-bundle repo ddcbright.flatpak io.github.mvrck19.ddcbright \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            ddcbright.deb
            ddcbright.flatpak

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish windows/DdcBright/DdcBright.csproj -c Release -r win-x64 -o publish-out

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DSourceExe="$pwd\publish-out\ddcbright.exe" /DMyAppVersion="$version" packaging\windows\ddcbright.iss

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Copy-Item publish-out\ddcbright.exe dist-windows\ddcbright.exe
          Copy-Item packaging\windows\ddcbright-setup.exe dist-windows\ddcbright-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-windows/*

  publish:
    needs: [build-windows, build-linux]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
        continue-on-error: true # ok if build-linux failed or was skipped

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="ddcbright.exe ddcbright-setup.exe"
          [ -f ddcbright.deb ] && assets="$assets ddcbright.deb"
          [ -f ddcbright.flatpak ] && assets="$assets ddcbright.flatpak"
          gh release create "${{ github.ref_name }}" $assets \
            --title "${{ github.ref_name }}" --generate-notes \
            --repo ${{ github.repository }}
